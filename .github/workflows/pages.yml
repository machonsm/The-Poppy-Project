name: Publish Poppy Project and refresh Substack

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC; schedules may be delayed by GitHub. Refresh the full archive, not RSS's latest page.
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: poppy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check root-domain hosting
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$PAGES_BASE_PATH" ]; then
            echo "::error::This site uses root-relative links. Set its custom domain in Settings > Pages before publishing; a repository subpath is not supported."
            exit 1
          fi
      - run: npm ci
      - run: npm run test:substack
      - name: Refresh every published Substack article
        run: npm run sync:substack
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static export
        id: deployment
        uses: actions/deploy-pages@v4
