name: Publish Poppy Project and refresh Substack

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC; schedules may be delayed by GitHub. Refresh the full archive, not RSS's latest page.
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: poppy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run test:substack
      - name: Refresh every published Substack article
        id: substack_sync
        # A failed refresh preserves the committed snapshot. Allow source changes
        # to publish; scheduled refreshes must still report a failure.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: npm run sync:substack
      - name: Report saved article fallback
        if: steps.substack_sync.outcome == 'failure' && github.event_name != 'schedule'
        run: echo "::warning::Substack refresh failed. Publishing the website with the saved article list; new articles will appear after a successful refresh."
      - name: Build the static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Preserve Next.js asset directories
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static export
        id: deployment
        uses: actions/deploy-pages@v4
